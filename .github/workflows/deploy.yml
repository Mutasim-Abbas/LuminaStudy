name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Same as Vercel's runtime (engines in package.json).
          node-version: 24
          cache: npm

      - run: npm ci

      # The site only ships if it is actually correct.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Pages serves the site from /LuminaStudy/, not the domain root.
      - run: npm run build -- --base=/LuminaStudy/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The server isn't on Pages, but it ships from the same commit — a broken
  # backend shouldn't get a green build.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # node:sqlite is only stable from Node 24 (see server/package.json).
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Again with the app on the libSQL client — the Turso code path. One
      # process, since the test files share this database file.
      - run: npx vitest run --poolOptions.forks.singleFork
        env:
          DATABASE_URL: file:${{ runner.temp }}/ci-libsql.db
      - run: npm run build
      # The container entrypoint; ShellCheck ships with GitHub's Ubuntu runners.
      - run: shellcheck scripts/start.sh

  # Every commit, not just the latest: a key deleted later is still in the
  # history anyone can clone. Fakes used by tests are allowlisted exactly in
  # .gitleaks.toml. The image is pinned by digest, like Litestream's.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the whole history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose /repo

  deploy:
    needs: [build, server, secrets]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
