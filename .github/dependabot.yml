# Weekly pull requests for dependency updates — a clean `npm audit` is only
# true on the day it ran. Minor and patch updates are grouped into one pull
# request per package, so security fixes arrive without a flood of PRs;
# majors come one at a time, since they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The workflow's actions and the Docker base images (Node, Litestream).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
